name: PR 364 Minimal Fix

on:
  push:
    branches:
      - agent/refactor-ai-dos-system-overview

permissions:
  contents: write

jobs:
  apply-minimal-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-ai-dos-system-overview
          fetch-depth: 0

      - name: Apply exact reviewed corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/AI-DOS/SystemOverview.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "| Validation Profile | None. This overview is not subject to a validation profile. |",
                  "| Validation Profile | None — explicit non-applicability exception for this non-normative explanatory overview; no document-class validation profile currently applies. |",
              ),
              ("The first diagram in Section 15.1 visualizes this separation.", "The first diagram in Section 14.1 visualizes this separation."),
              ("Section 15.2 visualizes the repository-entry and provider-entry flow.", "Section 14.2 visualizes the repository-entry and provider-entry flow."),
              ("Section 15.2 visualizes how an explicitly bounded task routes through this Operational Core.", "Section 14.3 visualizes how an explicitly bounded task routes through this Operational Core."),
              ("Section 15.3 visualizes this route.", "Section 14.3 visualizes this route."),
              ("Section 15.4 visualizes the state-derived planning route, including its safe-stop branches.", "Section 14.4 visualizes the state-derived planning route, including its safe-stop branches."),
              ("Section 15.5 visualizes these distinct lifecycle actions and the boundaries between them.", "Section 14.5 visualizes these distinct lifecycle actions and the boundaries between them."),
              (
                  "**Reading notes.** Solid-directional `.->` edges denote \"may inform\" or \"may authorize exactly one\" relationships, not automatic progression.",
                  "**Reading notes.** Dashed directional `-.->` edges denote \"may inform\" or \"may authorize exactly one\" relationships, not automatic progression.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/pr-364-minimal-fix.yml

      - name: Verify exact scope
        run: |
          test "$(git diff --name-only | sort)" = $'.github/workflows/pr-364-minimal-fix.yml\ndocs/AI-DOS/SystemOverview.md'
          test "$(git diff --numstat docs/AI-DOS/SystemOverview.md)" = $'8\t8\tdocs/AI-DOS/SystemOverview.md'

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI-DOS/SystemOverview.md .github/workflows/pr-364-minimal-fix.yml
          git commit -m "Apply minimal PR #364 review corrections"
          git push origin HEAD:agent/refactor-ai-dos-system-overview
